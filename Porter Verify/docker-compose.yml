# Local development stack for Porter Verify.
# Brings up PostgreSQL (core DB) and Redis (cache/rate-limit, used in later phases).
# The API can run on the host (uvicorn) against these, or as a container later.
#
#   docker compose up -d db        # just the database
#   docker compose up -d           # db + redis
#
# Credentials here are LOCAL-ONLY throwaway values. Production uses managed
# Postgres + a secrets manager — never these.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter
      POSTGRES_DB: porter_verify
    ports:
      - "5432:5432"
    volumes:
      - porter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porter_verify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  porter_pgdata:
